name: Atualizar resultados
on:
  schedule:
    - cron: '*/15 18-23,0-3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_scores.py'
      - 'scripts/update_standings.py'
      - 'scripts/update_remaining.py'
      - 'data/fixtures.json'
      - '.github/workflows/update-scores.yml'
permissions:
  contents: write
concurrency:
  group: atualizar-resultados-${{ github.ref }}
  cancel-in-progress: false
jobs:
  placares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar jogos concluídos
        run: python3 scripts/update_scores.py
      - name: Buscar classificação completa
        run: python3 scripts/update_standings.py
      - name: Buscar confrontos restantes
        run: python3 scripts/update_remaining.py
      - name: Publicar somente se houver novos resultados
        run: |
          if ! git diff --quiet -- data/results.json data/standings.json data/remaining.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json data/standings.json data/remaining.json
            git commit -m "data: atualizar placares concluídos"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Dados publicados com sucesso."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Falha após cinco tentativas de sincronização." >&2
                exit 1
              fi
              git fetch origin main
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/main
              python3 scripts/update_scores.py
              python3 scripts/update_standings.py
              python3 scripts/update_remaining.py
              if git diff --quiet -- data/results.json data/standings.json data/remaining.json; then
                echo "Dados já sincronizados por outra execução."
                break
              fi
              git add data/results.json data/standings.json data/remaining.json
              git commit -m "data: sincronizar resultados e calendário"
              sleep $((attempt * 2))
            done
          else
            echo "Nenhuma alteração nos placares."
          fi
