name: Atualizar resultados
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-resultados
  cancel-in-progress: false
jobs:
  placares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar jogos concluídos
        run: python3 scripts/update_scores.py
      - name: Publicar somente se houver novos resultados
        run: |
          if ! git diff --quiet -- data/results.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "data: atualizar placares concluídos"
            git push
          else
            echo "Nenhuma alteração nos placares."
          fi
